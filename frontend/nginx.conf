server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /dashboard {
        try_files /index.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    location = /signup {
        try_files /index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
